<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Prevent zoom on touch (maximum-scale=1.0, user-scalable=no) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>The Fortune Pack</title>
    <style>
      /* Prevent text selection and long-press callouts to further feel like an app */
      body {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: pan-y; /* Prevent double-tap zoom but allow scrolling */
      }
      
      /* Enforce portrait mode visually */
      @media screen and (orientation: landscape) and (max-height: 600px) {
        #root {
          display: none !important;
        }
        body::before {
          content: "세로 모드에 최적화된 화면입니다.\n기기를 세로로 회전해 주세요.";
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          width: 100vw;
          height: 100vh;
          background-color: #000;
          color: #FF9900;
          font-size: 16px;
          font-weight: bold;
          white-space: pre-wrap;
          line-height: 1.6;
          position: fixed;
          top: 0;
          left: 0;
          z-index: 9999;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Attempt to lock orientation via API if supported (often works in fullscreen/PWAs)
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(function(error) {
          console.log('Orientation lock failed:', error);
        });
      }
    </script>
  </body>
</html>
